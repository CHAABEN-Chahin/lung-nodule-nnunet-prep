<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520">
<style>
  text { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
  .title-main { font-size: 20px; font-weight: 700; fill: #0C447C; }
  .box-title { font-size: 13.5px; font-weight: 600; }
  .box-sub { font-size: 11px; font-weight: 400; }
  .n-teal rect { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 0.8; }
  .n-teal .box-title { fill: #085041; }
  .n-teal .box-sub { fill: #0F6E56; }
  .n-blue rect { fill: #E6F1FB; stroke: #185FA5; stroke-width: 0.8; }
  .n-blue .box-title { fill: #0C447C; }
  .n-blue .box-sub { fill: #185FA5; }
  .n-purple rect { fill: #EEEDFE; stroke: #534AB7; stroke-width: 0.8; }
  .n-purple .box-title { fill: #3C3489; }
  .n-purple .box-sub { fill: #534AB7; }
</style>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- Title -->
<text class="title-main" x="450" y="36" text-anchor="middle">Pipeline de détection des nodules pulmonaires</text>

<!-- ── ROW 1 ── -->
<!-- Dossier CT -->
<g class="n-teal">
  <rect x="30" y="58" width="190" height="64" rx="10"/>
  <text class="box-title" x="125" y="82" text-anchor="middle" dominant-baseline="central">Dossier CT</text>
  <text class="box-sub"   x="125" y="102" text-anchor="middle" dominant-baseline="central">Coupes DICOM</text>
</g>
<!-- Arrow → -->
<line x1="221" y1="90" x2="278" y2="90" stroke="#5F5E5A" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
<!-- Reconstruction 3D -->
<g class="n-blue">
  <rect x="280" y="58" width="190" height="64" rx="10"/>
  <text class="box-title" x="375" y="90" text-anchor="middle" dominant-baseline="central">Reconstruction 3D</text>
</g>
<!-- Arrow → -->
<line x1="471" y1="90" x2="528" y2="90" stroke="#5F5E5A" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
<!-- Volume 3D -->
<g class="n-teal">
  <rect x="530" y="58" width="190" height="64" rx="10"/>
  <text class="box-title" x="625" y="82" text-anchor="middle" dominant-baseline="central">Volume 3D</text>
  <text class="box-sub"   x="625" y="102" text-anchor="middle" dominant-baseline="central">.nii.gz</text>
</g>

<!-- Arrow ↓ Volume → Seg. pulm -->
<line x1="625" y1="123" x2="625" y2="178" stroke="#5F5E5A" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

<!-- ── ROW 2 ── -->
<!-- Seg. pulmonaire -->
<g class="n-blue">
  <rect x="530" y="180" width="190" height="64" rx="10"/>
  <text class="box-title" x="625" y="202" text-anchor="middle" dominant-baseline="central">Seg. pulmonaire</text>
  <text class="box-sub"   x="625" y="222" text-anchor="middle" dominant-baseline="central">Total Segmentator</text>
</g>
<!-- Arrow ← -->
<line x1="528" y1="212" x2="472" y2="212" stroke="#5F5E5A" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
<!-- Masque pulmonaire -->
<g class="n-teal">
  <rect x="280" y="180" width="190" height="64" rx="10"/>
  <text class="box-title" x="375" y="202" text-anchor="middle" dominant-baseline="central">Masque pulmonaire</text>
  <text class="box-sub"   x="375" y="222" text-anchor="middle" dominant-baseline="central">3D segmenté</text>
</g>
<!-- Arrow ← -->
<line x1="278" y1="212" x2="222" y2="212" stroke="#5F5E5A" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
<!-- Création de patches -->
<g class="n-teal">
  <rect x="30" y="180" width="190" height="64" rx="10"/>
  <text class="box-title" x="125" y="202" text-anchor="middle" dominant-baseline="central">Création de patches</text>
  <text class="box-sub"   x="125" y="222" text-anchor="middle" dominant-baseline="central">Intérieur poumon</text>
</g>

<!-- Arrow ↓ Création → Patches -->
<line x1="125" y1="245" x2="125" y2="298" stroke="#5F5E5A" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

<!-- ── ROW 3 ── -->
<!-- Patches 3D -->
<g class="n-teal">
  <rect x="30" y="300" width="190" height="64" rx="10"/>
  <text class="box-title" x="125" y="322" text-anchor="middle" dominant-baseline="central">Patches 3D</text>
  <text class="box-sub"   x="125" y="342" text-anchor="middle" dominant-baseline="central">Avec chevauchement</text>
</g>
<!-- Arrow → -->
<line x1="221" y1="332" x2="338" y2="332" stroke="#5F5E5A" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
<!-- Détection des nodules (wider) -->
<g class="n-blue">
  <rect x="340" y="300" width="220" height="64" rx="10"/>
  <text class="box-title" x="450" y="322" text-anchor="middle" dominant-baseline="central">Détection des nodules</text>
  <text class="box-sub"   x="450" y="342" text-anchor="middle" dominant-baseline="central">Modèle NN-UNet V1</text>
</g>

<!-- Arrow ↓ Détection → Masques -->
<line x1="450" y1="365" x2="450" y2="418" stroke="#5F5E5A" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

<!-- ── ROW 4 ── -->
<!-- Masques prédits -->
<g class="n-teal">
  <rect x="340" y="420" width="220" height="64" rx="10"/>
  <text class="box-title" x="450" y="442" text-anchor="middle" dominant-baseline="central">Masques nodules prédits</text>
  <text class="box-sub"   x="450" y="462" text-anchor="middle" dominant-baseline="central">Prédictions 3D</text>
</g>
<!-- Arrow ← -->
<line x1="338" y1="452" x2="222" y2="452" stroke="#5F5E5A" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
<!-- Classificateur final -->
<g class="n-purple">
  <rect x="30" y="420" width="190" height="64" rx="10"/>
  <text class="box-title" x="125" y="442" text-anchor="middle" dominant-baseline="central">Classificateur final</text>
  <text class="box-sub"   x="125" y="462" text-anchor="middle" dominant-baseline="central">Nodule / Non-nodule</text>
</g>

<!-- Legend -->
<g>
  <rect x="600" y="420" width="12" height="12" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
  <text x="618" y="431" font-family="Helvetica Neue, Arial, sans-serif" font-size="10" fill="#5F5E5A">Données</text>
  <rect x="600" y="438" width="12" height="12" rx="3" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
  <text x="618" y="449" font-family="Helvetica Neue, Arial, sans-serif" font-size="10" fill="#5F5E5A">Traitement / Modèle</text>
  <rect x="600" y="456" width="12" height="12" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
  <text x="618" y="467" font-family="Helvetica Neue, Arial, sans-serif" font-size="10" fill="#5F5E5A">Classification</text>
</g>
</svg>
